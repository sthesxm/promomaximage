<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoção Máxima da Gê 💕🏠 | Entrar no Grupo</title>

  <style>
    :root{
      --pink:#ffc9c9;
      --pink-dark:#ff9191;
      --amber:#793032;
      --text-main:#793032;
      --gray:#555;
      --muted:#777;
      --shadow:0 10px 25px rgba(0,0,0,.1);
      --radius:18px;
      --footer-bg:#793032;
      --white:#ffffff;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:#fff;color:var(--text-main);
      padding-bottom:80px;
    }

    header{
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
      padding:20px 20px 26px;
      text-align:center;
      border-radius:0 0 28px 28px;
      color:var(--text-main);
      box-shadow:var(--shadow);
    }
    .logo-wrap{
      width:120px;
      height:120px;
      margin:0 auto 12px;
      border-radius:50%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 20px rgba(0,0,0,.2);
      overflow:hidden;
    }
    .logo-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      border-radius:50%;
    }
    h1{font-size:28px;font-weight:800;margin-bottom:6px;}
    .subtitle{
      font-size:15px;
      color:var(--text-main);
      margin-bottom:10px;
    }

    /* Vagas + prova social */
    .vacancy-wrap{max-width:600px;margin:4px auto 4px;text-align:center;}
    .vacancy-top{
      font-weight:800;
      font-size:13px;
      margin-bottom:6px;
      color:#555;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      line-height:1.3;
    }
    .online-dot{
      width:10px;height:10px;border-radius:50%;
      background:#1e8e3e;
      display:inline-block;
      animation:pulseDot 1.2s infinite;
    }
    @keyframes pulseDot {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: .5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bar{
      width:100%;
      height:10px; /* barra mais fina */
      background:#f1f1f1;
      border:2px solid #ddd;
      border-radius:999px;
      position:relative;
      overflow:hidden;
    }
    .bar>.fill{
      position:absolute;
      inset:0 100% 0 0;
      background:linear-gradient(90deg,#ffc107,#9d2e31);
      border-radius:999px;
      transition:inset .5s ease;
    }

    /* Botão principal */
    .cta-section{text-align:center;margin:10px auto 0;padding:15px;max-width:700px;}
    .cta-btn{
      display:inline-block;padding:16px 32px;
      width:100%;
      border-radius:999px;font-weight:800;font-size:18px;
      background:linear-gradient(180deg,#ff7f7f,#9d2e31);
      color:#fff;border:none;cursor:pointer;
      animation:pulse 1.6s ease-in-out infinite;
      box-shadow:0 10px 25px rgba(255,145,145,.35);
      position:relative;
      overflow:hidden;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.06);}
    }

    /* Setas animadas */
    .cta-btn span{display:inline-block;vertical-align:middle;}
    .arrow{
      font-weight:900;
      font-size:22px;
      animation:arrowBlink 1.5s ease-in-out infinite;
    }
    @keyframes arrowBlink{
      0%,100%{opacity:1;transform:translateX(0);}
      50%{opacity:0.7;transform:translateX(4px);}
    }

    /* Footer */
    .sticky-footer{
      position:fixed;bottom:0;left:0;right:0;
      background:var(--footer-bg);
      color:var(--white);
      padding:12px 16px;
      box-shadow:0 -8px 20px rgba(0,0,0,.2);
      display:flex;align-items:center;justify-content:space-between;
      z-index:50;
    }
    .sticky-footer div{font-weight:700;}
    .sticky-btn{
      background:linear-gradient(180deg,var(--pink),var(--pink-dark));
      color:var(--text-main);
      border:none;
      border-radius:999px;
      padding:14px 26px;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(255,145,145,.35);
      margin-left:10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <img src="https://i.postimg.cc/tR6jwS7T/IMG-20251009-WA1548.jpg" alt="Promoção Máxima da Gê">
    </div>
    <h1>Promoção Máxima da Gê 💕🏠</h1>
    <div class="subtitle">As melhores promoções de casa, cozinha, beleza moda e mais no seu WhatsApp.</div>
  </header>

  <section class="cta-section">
    <div class="vacancy-wrap">
      <div class="vacancy-top">
        <span class="online-dot"></span>+7.500 membros ativos · 🎯 1 clique · 🚫 Sem spam · ⏱️ Saia quando quiser
      </div>
      <div class="bar"><div class="fill" id="fillBar"></div></div>
    </div>

    <button id="ctaMain" class="cta-btn">
      <span class="arrow">→</span> ENTRAR GRÁTIS NO GRUPO <span class="arrow">←</span>
    </button>
  </section>

  <div class="sticky-footer">
    <div>⏳ Últimas vagas de hoje</div>
    <button id="ctaFooter" class="sticky-btn">Entrar no grupo</button>
  </div>

  <script>
    const WHATS_LINK="https://sndflw.com/i/promocaomaximage";
    const START_VACANCIES=24, MIN_VACANCIES=2;
    const fillBar=document.getElementById('fillBar');
    let currentVacancies = parseInt(localStorage.getItem("currentVacancies")) || START_VACANCIES;
    function normalizeDateStr(d){return new Date(d.getFullYear(), d.getMonth(), d.getDate()).toDateString();}
    const todayStr = normalizeDateStr(new Date());
    const lastResetDate = localStorage.getItem("lastResetDate");
    if (lastResetDate !== todayStr) { resetVacancies(); }
    scheduleMidnightReset();
    function resetVacancies(){
      currentVacancies = START_VACANCIES;
      localStorage.setItem("currentVacancies", currentVacancies);
      localStorage.setItem("lastResetDate", normalizeDateStr(new Date()));
      updateVacancyUI();
    }
    function scheduleMidnightReset(){
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
      const msToMidnight = nextMidnight.getTime() - now.getTime();
      setTimeout(() => {
        resetVacancies();
        setInterval(resetVacancies, 24*60*60*1000);
      }, msToMidnight);
    }
    function updateVacancyUI(){
      const filled=(START_VACANCIES-currentVacancies)/(START_VACANCIES-MIN_VACANCIES);
      const pct=Math.max(0,Math.min(1,filled));
      fillBar.style.inset=`0 ${(1-pct)*100}% 0 0`;
    }
    function step(){
      if(currentVacancies<=MIN_VACANCIES) return;
      currentVacancies--;
      localStorage.setItem("currentVacancies", currentVacancies);
      updateVacancyUI();
      if(currentVacancies>MIN_VACANCIES){
        const nextMs=[1000,2000,3000][Math.floor(Math.random()*3)];
        setTimeout(step,nextMs);
      }
    }
    function handleClick(){
      if('vibrate' in navigator) navigator.vibrate(15);
      try{ fbq('track','Lead'); }catch(e){}
      setTimeout(()=>{ window.open(WHATS_LINK,'_blank'); },500);
    }
    document.getElementById('ctaMain').addEventListener('click',handleClick);
    document.getElementById('ctaFooter').addEventListener('click',handleClick);
    window.addEventListener('load',()=>{
      updateVacancyUI();
      if(currentVacancies>MIN_VACANCIES){ setTimeout(step,1000); }
    });
  </script>
</body>
</html>
